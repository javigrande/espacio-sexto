:root{--navy:#133a67;--blue:#2467b5;--ink:#20334e;--muted:#61718a;--line:#dce5f3;--bg:#f2f6fd;--card:#fff;--green:#0b936e;--orange:#f5a623;--pink:#e04d7b;--purple:#7558bf;--shadow:0 12px 30px rgba(24,59,107,.09)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,#e0efff,transparent 31%),var(--bg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.top{background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:15px;padding:12px max(20px,calc((100% - 1180px)/2));box-shadow:0 4px 18px #153a6130}.brand{display:flex;gap:12px;align-items:center}.brand strong{display:block;letter-spacing:.05em;font-weight:900;font-size:clamp(14px,2vw,21px)}.brand small{display:block;opacity:.85}.logo{font-size:37px}.top-actions{display:flex;align-items:center;gap:10px}.student-tag{font-weight:800;font-size:13px}.ghost{border:1px solid #ffffff66;background:#ffffff17;color:#fff;border-radius:12px;padding:9px 14px;font-weight:800}.shell{max-width:1180px;margin:auto;padding:26px 18px 70px;min-height:75vh}.hero{background:linear-gradient(120deg,#153e74,#4279c9);color:#fff;border-radius:27px;padding:clamp(24px,4vw,45px);position:relative;overflow:hidden;box-shadow:var(--shadow)}.hero:after{content:'🦴  👁️  👂  🧬';font-size:68px;opacity:.24;position:absolute;right:-16px;bottom:-35px;transform:rotate(-10deg)}h1,h2,h3{line-height:1.16}h1{font-size:clamp(29px,4vw,48px);margin:8px 0 13px;font-weight:900}h2{font-size:clamp(23px,3vw,34px);margin:0 0 10px;font-weight:900}h3{font-size:20px;font-weight:900;margin:0 0 10px}.hero p{max-width:650px;font-size:18px;margin:0}.eyebrow{display:inline-block;border-radius:30px;background:#ffffff30;padding:5px 13px;font-weight:900;font-size:12px;letter-spacing:.09em}.panel{background:var(--card);padding:25px;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);margin-top:22px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px;margin:22px 0}.session{background:white;border-radius:22px;border:1px solid var(--line);padding:21px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}.session .icon{font-size:36px}.session p{margin:0;color:var(--muted)}.session .start{margin-top:auto}.chip{font-size:12px;font-weight:900;border-radius:100px;padding:5px 10px;display:inline-flex;align-items:center;gap:5px;background:#e9f1ff;color:#205699}.chip.done{background:#ddf8ed;color:#0b805f}.chip.warn{background:#fff0ce;color:#825000}.btn{background:var(--blue);color:#fff;border:none;padding:11px 18px;border-radius:12px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:hover{filter:brightness(1.08)}.btn.secondary{background:#e9f1ff;color:#245893}.btn.success{background:var(--green)}.btn.danger{background:#ffedf1;color:#b52754}.btn.small{padding:7px 12px;font-size:14px}.btn:focus-visible,.option:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f7ac2d;outline-offset:3px}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.prog{height:12px;border-radius:50px;background:#dfe9f7;overflow:hidden;margin-top:10px}.prog>div{height:100%;background:linear-gradient(90deg,#43a2fc,#11b28e);transition:width .25s}.muted{color:var(--muted)}.task-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.task-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.task-card strong{display:block;font-weight:900;font-size:18px;margin:9px 0}.task-card p{font-size:14px;color:var(--muted)}.task-top{display:flex;align-items:center;justify-content:space-between}.stepnav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.stepnav .path{font-size:14px;font-weight:900;color:var(--muted)}.challenge{background:#fff;border:1px solid var(--line);border-radius:23px;box-shadow:var(--shadow);padding:clamp(18px,3vw,32px)}.challenge-head{display:flex;align-items:center;gap:16px;margin-bottom:24px}.challenge-head .glyph{font-size:50px;background:#eff5ff;border-radius:17px;padding:9px}.challenge-head p{color:var(--muted);margin:5px 0}.question{background:#f9fbff;border:1px solid #e5edf9;border-radius:17px;padding:19px;margin:18px 0}.question>h3{font-size:17px}.question>p{margin:0 0 14px}.qindex{color:#3679be;font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.option-group{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.option{border:2px solid #e1e9f6;border-radius:12px;padding:12px 14px;text-align:left;background:#fff;color:var(--ink);font-weight:800;min-height:48px}.option.active{border-color:var(--blue);background:#e9f3ff}.option.right{border-color:#14a579;background:#e3f9ee}.option.wrong{border-color:#db4967;background:#ffedf2}.text-input,textarea{border:2px solid #dce6f4;background:#fff;border-radius:12px;padding:12px;width:100%;color:var(--ink)}textarea{min-height:100px;resize:vertical}label.field{display:block;font-weight:900;margin-bottom:6px}.order-list{display:flex;flex-wrap:wrap;gap:9px;margin:10px 0}.order-item{background:#eaf2ff;color:#194a83;border:1px solid #bdd3f4;padding:9px 13px;border-radius:12px;font-weight:800;display:flex;gap:7px;align-items:center}.order-item button{border:0;border-radius:7px;background:#fff;padding:1px 8px;font-weight:900}.feedback{background:#e5f8ee;border-left:5px solid #1eac7d;padding:13px 15px;border-radius:10px;margin-top:14px}.feedback.bad{background:#fff4df;border-color:#eeab35}.hint{background:#fff5dc;border-left:5px solid #f0b538;padding:14px;border-radius:10px;margin:16px 0}.case{border-left:5px solid var(--purple);background:#f4efff;border-radius:12px;padding:15px;margin:10px 0}.divider{height:1px;background:var(--line);margin:19px 0}.score{font-weight:900;color:var(--green)}.report-table{width:100%;border-collapse:collapse}.report-table td,.report-table th{border-bottom:1px solid var(--line);padding:12px;text-align:left}.report-table th{color:#406392}.label{font-size:13px;font-weight:900;color:var(--muted)}.foot{text-align:center;color:#6f819e;padding:18px;font-size:13px}.foot span{color:#f7a432}.toast{position:fixed;bottom:24px;right:22px;background:#113d6a;color:#fff;padding:12px 20px;border-radius:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;z-index:10}.toast.show{opacity:1}.teacher{background:#f4f0ff;border:1px solid #ddd1fa;border-radius:16px;padding:17px;margin-top:20px}.teacher summary{cursor:pointer;font-weight:900}.teacher .teacher-inner{padding-top:8px}.minor{font-size:13px;color:var(--muted)}.badge-count{background:#fff4d1;color:#7a560a;border-radius:10px;padding:4px 9px;font-weight:900}.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.printonly{display:none}@media(max-width:800px){.grid{grid-template-columns:1fr}.task-grid{grid-template-columns:1fr}.option-group{grid-template-columns:1fr}.top{padding:11px 14px}.student-tag{display:none}.hero:after{font-size:35px}.challenge-head .glyph{font-size:34px}.stepnav{align-items:flex-start}}@media print{.top,.foot,.buttons,.btn,.ghost,.teacher,.stepnav{display:none!important}.shell{padding:0}.challenge,.panel,.task-card{box-shadow:none;break-inside:avoid}body{background:#fff}.printonly{display:block}textarea{border:1px solid #888}}

<header class="top"><div class="brand"><span class="logo">🧠</span><div><strong>MISIÓN CUERPO HUMANO</strong><small>Ciencias Naturales · 6.º de Primaria</small></div></div><div class="top-actions"><span id="studentTag" class="student-tag">Sin identificar</span><button id="btnHome" class="ghost">⌂ Inicio</button></div></header>
<main id="app" class="shell" aria-live="polite"></main>

<script>
'use strict';
// Aplicación 100 % estática. Los datos se guardan solo en este navegador.
const KEY='mision-cuerpo-6ep-v1';
const SESSIONS=[{id:1,title:'Recuperamos conocimientos',subtitle:'Identificar, ordenar y relacionar',icon:'🧬',tasks:[1,3,4,7]},{id:2,title:'Pensamos como científicos',subtitle:'Analizar, deducir y corregir',icon:'🔬',tasks:[2,5,6,9]},{id:3,title:'Aplicamos lo aprendido',subtitle:'Resolver situaciones y explicar',icon:'🏥',tasks:[8,10]}];
const q=(id,text,type,opts={},answer=null,explain='')=>({id,text,type,opts,answer,explain});
const TASKS=[
{id:1,icon:'🧬',title:'La escalera de la vida',desc:'Organizamos el cuerpo humano de lo más pequeño a lo más complejo.',level:2,questions:[q('1a','Ordena los niveles de organización, de menor a mayor.','order',{items:['Órgano','Organismo','Célula','Aparato o sistema','Tejido']},['Célula','Tejido','Órgano','Aparato o sistema','Organismo'],'Una célula forma parte de un tejido; los tejidos forman órganos; los órganos se integran en aparatos o sistemas; y estos constituyen el organismo.'),...[['Neurona','Célula'],['Tejido muscular','Tejido'],['Cerebro','Órgano'],['Sistema nervioso','Aparato o sistema'],['Ser humano','Organismo']].map(([v,a],i)=>q('1b'+i,`¿Qué nivel de organización representa «${v}»?`,'choice',{items:['Célula','Tejido','Órgano','Aparato o sistema','Organismo']},a)),q('1c','¿Puede un órgano estar formado por tejidos diferentes? Pon un ejemplo.','text',{},null,'Sí. Por ejemplo, el estómago contiene tejido muscular, epitelial y nervioso.')]},
{id:2,icon:'🚗',title:'El camino de los estímulos',desc:'Reconstruimos la respuesta al claxon de un coche.',level:3,lead:'Caminas por la calle, oyes el claxon de un coche, miras hacia el sonido y te apartas.',questions:[q('2a','¿Cuál es el estímulo?','choice',{items:['El sonido del claxon','La acción de caminar','El movimiento de los brazos','La señal del semáforo']},'El sonido del claxon'),q('2b','¿Qué órgano capta inicialmente el sonido?','choice',{items:['El oído','El ojo','La piel','La lengua']},'El oído'),q('2c','¿Qué sistema procesa la información?','choice',{items:['Sistema nervioso','Sistema muscular','Sistema digestivo','Sistema esquelético']},'Sistema nervioso'),q('2d','¿Qué estructuras ejecutan el movimiento de apartarse?','choice',{items:['Los músculos','Los receptores','Los tímpanos','Los sentidos']},'Los músculos'),q('2e','Ordena las fases generales de la función de relación.','order',{items:['Respuesta','Sistema nervioso','Estímulo','Órgano efector','Receptor']},['Estímulo','Receptor','Sistema nervioso','Órgano efector','Respuesta']),q('2f','¿Qué riesgo existiría si no percibieras el claxon?','text',{},null,'Podrías no reaccionar a tiempo y sufrir un accidente.')]},
{id:3,icon:'👁️',title:'Detectives de los sentidos',desc:'¿Qué sentido interviene principalmente en cada situación?',level:2,questions:[...[['Reconocer una canción','Oído'],['Saber si una sopa está salada','Gusto'],['Notar que una taza quema','Tacto'],['Reconocer un perfume','Olfato'],['Distinguir rojo de azul','Vista'],['Percibir la suavidad de una manta','Tacto']].map(([s,a],i)=>q('3'+i,s,'choice',{items:['Vista','Oído','Olfato','Gusto','Tacto']},a)),q('3g','¿Utilizamos siempre un único sentido? Justifica con dos ejemplos.','text',{},null,'No. Al comer combinamos gusto, olfato y a veces vista; al cruzar una calle usamos vista y oído.')]},
{id:4,icon:'👂',title:'El viaje misterioso del sonido',desc:'Sigue las ondas sonoras hasta el cerebro.',level:3,questions:[q('4a','Ordena el recorrido general de la audición.','order',{items:['Nervio auditivo','Tímpano','Caracol','Pabellón auditivo','Cerebro','Huesecillos','Conducto auditivo externo']},['Pabellón auditivo','Conducto auditivo externo','Tímpano','Huesecillos','Caracol','Nervio auditivo','Cerebro']),q('4b','¿Los sonidos llegan al cerebro sin transformarse? Razona.','text',{},null,'No. Las vibraciones se convierten en impulsos nerviosos en los receptores del caracol.'),q('4c','¿Qué ocurriría si el nervio auditivo estuviera dañado?','text',{},null,'La información auditiva no llegaría correctamente al cerebro aunque el tímpano funcionara.')]},
{id:5,icon:'🕵️',title:'El gran detector de errores',desc:'Descubre cuáles son falsas y explica cómo corregirlas.',level:3,questions:[...[
['Todos los órganos están formados por un único tipo de célula.','Falsa','Los órganos están formados por distintos tejidos y tipos celulares.'],
['Los sentidos captan información de nuestro entorno.','Verdadera','Los receptores detectan diferentes estímulos.'],
['El tímpano transforma los sonidos en imágenes.','Falsa','El tímpano vibra con las ondas sonoras; la audición no produce imágenes.'],
['El cerebro participa en la interpretación sensorial.','Verdadera','El cerebro procesa las señales que llegan desde los receptores.'],
['El nervio auditivo lleva información auditiva al cerebro.','Verdadera','Transporta señales nerviosas relacionadas con la audición.'],
['El oído interno también participa en el equilibrio.','Verdadera','El sistema vestibular detecta movimientos y posición de la cabeza.'],
['Los receptores del tacto están solo en las manos.','Falsa','La piel de muchas zonas del cuerpo contiene receptores sensoriales.'],
['Olfato y gusto colaboran al reconocer alimentos.','Verdadera','Ambos contribuyen a la percepción del sabor.']].flatMap(([s,a,e],i)=>[q('5a'+i,s,'choice',{items:['Verdadera','Falsa']},a,e),...(a==='Falsa'?[q('5b'+i,'Corrige la afirmación falsa anterior.','text',{},null,e)]:[])]),q('5z','Elige un error y explica por qué alguien podría creerlo.','text',{},null,'Una explicación posible: confundir un órgano con un tejido y olvidar que los órganos combinan distintos tejidos.')]},
{id:6,icon:'🔬',title:'¿Qué pasaría si…?',desc:'Cinco situaciones para pensar como científicos.',level:4,questions:[...[
['El ojo capta luz, pero el nervio óptico no transmite señales. ¿Qué pasaría?','La información visual no llegaría correctamente al cerebro, por lo que se vería afectada la visión.'],
['El tímpano no puede vibrar correctamente. ¿Qué cambiaría?','La transmisión de las vibraciones sonoras al oído medio se vería dificultada y podría disminuir la audición.'],
['Tenemos la nariz congestionada. ¿Por qué los alimentos parecen tener menos sabor?','El olfato contribuye a percibir los aromas de la comida; con congestión se perciben peor.'],
['La piel no detecta bien el calor. ¿Qué riesgo existe?','Se podrían producir quemaduras por no reconocer a tiempo una temperatura peligrosa.'],
['Una alteración del oído interno provoca mareos. ¿Cómo es posible?','Las estructuras vestibulares del oído interno participan en el equilibrio, independientemente de los receptores auditivos.']].map(([s,e],i)=>q('6'+i,s,'text',{},null,e)),q('6z','¿Qué tienen en común los cinco casos?','text',{},null,'Muestran la importancia de los receptores, las vías nerviosas y el cerebro para captar e interpretar estímulos y responder.')]},
{id:7,icon:'🧩',title:'Cada estructura con su función',desc:'Relaciona cada órgano o estructura con lo que hace.',level:2,questions:[...[
['Retina','Contiene receptores sensibles a la luz'],['Nervio óptico','Transmite información visual al cerebro'],['Pabellón auditivo','Recoge las ondas sonoras'],['Caracol','Transforma vibraciones en señales nerviosas'],['Receptores olfativos','Detectan sustancias olorosas'],['Receptores gustativos','Detectan sustancias responsables de los sabores'],['Receptores de la piel','Detectan presión y temperatura']].map(([s,a],i)=>q('7'+i,`¿Cuál es la función de «${s}»?`,'choice',{items:['Contiene receptores sensibles a la luz','Transmite información visual al cerebro','Recoge las ondas sonoras','Transforma vibraciones en señales nerviosas','Detectan sustancias olorosas','Detectan sustancias responsables de los sabores','Detectan presión y temperatura']},a)),q('7z','¿Qué semejanza tienen el nervio óptico y el auditivo?','text',{},null,'Ambos transportan señales nerviosas sensoriales hacia el cerebro.')]},
{id:8,icon:'🏥',title:'El hospital de los sentidos',desc:'Diagnostica riesgos y recomienda hábitos saludables.',level:4,questions:[...[
['Caso A · El concierto','Un adolescente escucha música muy alta con auriculares durante horas. ¿Qué puede ocurrir y qué dos consejos le darías?','El ruido intenso o prolongado puede dañar la audición. Recomendar bajar el volumen y limitar el tiempo de exposición.'],
['Caso B · La pantalla','Una alumna pasa horas ante una pantalla sin descansar. ¿Qué molestias podría sentir y qué hábitos mejorar?','Puede experimentar fatiga visual o sequedad. Recomendar pausas, parpadear, ajustar la distancia e iluminación.'],
['Caso C · La quemadura','Un niño toca una superficie caliente y retira rápidamente la mano. ¿Qué estímulo y sentido intervienen?','La piel detecta calor potencialmente dañino; se activa una respuesta protectora, que puede incluir un reflejo medular.'],
['Caso D · La comida misteriosa','Una persona resfriada distingue peor el sabor de los alimentos. ¿Por qué y qué sentidos colaboran?','Por la menor percepción de los aromas: olfato y gusto trabajan juntos.']].map(([title,s,e],i)=>q('8'+i,`${title}. ${s}`,'text',{},null,e))]},
{id:9,icon:'🧠',title:'¿Cuál no encaja?',desc:'Elige el intruso y justifica tu elección.',level:3,questions:[...[
[['Neurona','Glóbulo rojo','Célula muscular','Estómago'],'Estómago','Los demás son células; el estómago es un órgano.'],
[['Retina','Cristalino','Iris','Caracol'],'Caracol','Los otros tres pertenecen al ojo; el caracol está en el oído interno.'],
[['Martillo','Yunque','Estribo','Fémur'],'Fémur','Los otros son huesecillos del oído medio; el fémur está en el muslo.'],
[['Vista','Oído','Olfato','Cerebro'],'Cerebro','Los otros son sentidos; el cerebro es un órgano del sistema nervioso.'],
[['Tímpano','Pabellón auditivo','Conducto auditivo externo','Nervio óptico'],'Nervio óptico','Los demás son estructuras del oído; el nervio óptico transmite información visual.']].flatMap(([items,a,e],i)=>[q('9a'+i,'¿Qué elemento no pertenece al grupo?','choice',{items},a,e),q('9b'+i,'Justifica por qué ese elemento es diferente.','text',{},null,e)]),q('9z','¿Por qué es importante justificar, además de acertar?','text',{},null,'Justificar demuestra comprensión de las relaciones y categorías, no solo memoria o azar.')]},
{id:10,icon:'🏆',title:'El gran desafío final',desc:'Integra sentidos, nervios y movimiento en una explicación.',level:4,lead:'Vas en bicicleta por un parque. Oyes ladrar a un perro, lo ves acercarse y decides frenar para evitar un accidente.',questions:[q('10a','Explica en 5-8 líneas lo sucedido usando: estímulo, receptores, oído, ojo, nervios, cerebro, músculos y respuesta.','text',{},null,'El ladrido y la imagen del perro son estímulos. Los receptores del oído y del ojo detectan sonido y luz. Las señales viajan por vías nerviosas al sistema nervioso, que las procesa. El cerebro coordina una respuesta; los músculos actúan para frenar y mantener el equilibrio.'),q('10b','¿Por qué los sentidos, el sistema nervioso y el aparato locomotor deben trabajar coordinadamente?','text',{},null,'Los sentidos detectan estímulos, el sistema nervioso procesa la información y coordina las respuestas, y los músculos mueven el esqueleto para actuar.')]}
];
let state=load(); let route={page:'home'};let showKeys=false;
function load(){try{const p=JSON.parse(localStorage.getItem(KEY));return p&&typeof p==='object'?{name:p.name||'',responses:p.responses||{},completed:p.completed||{}}:{name:'',responses:{},completed:{}}}catch{return{name:'',responses:{},completed:{}}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const completed=()=>TASKS.filter(t=>state.completed[t.id]).length;
const score=t=>{let total=0,correct=0;for(const qu of t.questions){if(qu.answer===null)continue;total++;const v=state.responses[t.id+'_'+qu.id];if(qu.type==='order'?JSON.stringify(v)===JSON.stringify(qu.answer):v===qu.answer)correct++}return{total,correct}};
const bar=()=>`<div class="prog" role="progressbar" aria-label="Progreso total" aria-valuenow="${completed()}" aria-valuemax="10"><div style="width:${completed()*10}%"></div></div>`;
const btn=(label,onclick,extra='')=>`<button class="btn ${extra}" data-action="${onclick}">${label}</button>`;
function home(){return `<section class="hero"><span class="eyebrow">GRAN REPASO · 10 MISIONES</span><h1>🧠 ¡Misión Cuerpo Humano!</h1><p>Explora la organización del cuerpo, investiga los cinco sentidos y demuestra cómo colaboran con el sistema nervioso.</p></section><section class="panel"><div class="inline" style="justify-content:space-between"><h2>Tu expedición</h2><span class="chip ${completed()===10?'done':''}">${completed()} / 10 actividades completadas</span></div>${bar()}<div class="inline" style="margin-top:18px"><div style="flex:1;min-width:220px"><label class="field" for="name">Nombre o equipo</label><input id="name" class="text-input" maxlength="50" placeholder="Escribe tu nombre" value="${esc(state.name)}"></div>${btn('💾 Guardar nombre','name','secondary')}</div></section><div class="grid">${SESSIONS.map(s=>{const n=s.tasks.filter(i=>state.completed[i]).length;return `<article class="session"><span class="icon">${s.icon}</span><span class="chip ${n===s.tasks.length?'done':''}">Sesión ${s.id} · ${n}/${s.tasks.length} completadas</span><h3>${s.title}</h3><p>${s.subtitle}</p>${btn('Entrar a la sesión →',`session:${s.id}`,'start')}</article>`}).join('')}</div><section class="panel"><h3>📊 Mis resultados</h3><p class="muted">Las respuestas se guardan automáticamente en este dispositivo. Las preguntas abiertas requieren revisión del profesor o autoevaluación con el modelo.</p><div class="buttons">${btn('Ver mi informe','report','secondary')}${btn('Imprimir informe','print','secondary')}${btn('Borrar mi progreso','reset','danger')}</div></section>`}
function session(id){const s=SESSIONS.find(x=>x.id===id);return `<div class="stepnav">${btn('← Volver al inicio','home','secondary')}<span class="path">SESIÓN ${s.id} / 3</span></div><section class="hero"><span class="eyebrow">${s.icon} SESIÓN ${s.id}</span><h1>${s.title}</h1><p>${s.subtitle}</p></section><div class="task-grid" style="margin-top:20px">${s.tasks.map(i=>{const t=TASKS.find(t=>t.id===i);return `<article class="task-card"><div class="task-top"><span style="font-size:36px">${t.icon}</span><span class="chip ${state.completed[i]?'done':''}">${state.completed[i]?'✓ Terminada':`Dificultad ${'★'.repeat(t.level)}`}</span></div><strong>${t.title}</strong><p>${t.desc}</p>${btn(state.completed[i]?'Revisar actividad →':'Comenzar reto →',`task:${i}`)}</article>`}).join('')}</div>`}
function task(id){const t=TASKS.find(t=>t.id===id),sid=SESSIONS.find(s=>s.tasks.includes(id)).id;return `<div class="stepnav">${btn('← Sesión '+sid,`session:${sid}`,'secondary')}<span class="path">RETO ${id} / 10</span></div><section class="challenge"><div class="challenge-head"><span class="glyph">${t.icon}</span><div><span class="chip">RETO ${id} · ${'★'.repeat(t.level)}</span><h2>${t.title}</h2><p>${t.desc}</p></div></div>${t.lead?`<div class="case"><strong>Situación:</strong> ${esc(t.lead)}</div>`:''}<div class="hint">💡 <strong>Antes de responder:</strong> piensa por tu cuenta, explica a tus compañeros y consensuad las respuestas. En preguntas abiertas, escribe ideas completas.</div>${t.questions.map((qu,i)=>renderQ(t,qu,i)).join('')}<div class="buttons">${btn(state.completed[id]?'✓ Guardado · Volver a evaluar':'✓ Terminar y comprobar',`finish:${id}`,'success')}${btn('Guardar y salir',`session:${sid}`,'secondary')}</div>${state.completed[id]?`<div class="feedback"><strong>¡Actividad registrada!</strong> ${score(t).total?`Preguntas autocorregibles: ${score(t).correct} de ${score(t).total}.`:''} Las preguntas abiertas se revisan con la explicación modelo.</div>`:''}<details class="teacher" ${showKeys?'open':''}><summary>🔎 Explicaciones modelo y orientaciones de corrección</summary><div class="teacher-inner"><p class="minor">Abre este apartado tras responder. En respuestas abiertas no existe una única redacción válida.</p>${t.questions.map((qu,i)=>`<p><strong>${i+1}.</strong> ${esc(qu.answer===null?qu.explain:Array.isArray(qu.answer)?qu.answer.join(' → '):qu.answer)}${qu.answer!==null&&qu.explain?' · '+esc(qu.explain):''}</p>`).join('')}</div></details></section>`}
function renderQ(t,qu,i){const key=t.id+'_'+qu.id,val=state.responses[key];let body='';if(qu.type==='choice')body=`<div class="option-group">${qu.opts.items.map(v=>`<button class="option ${val===v?'active':''} ${state.completed[t.id]&&val===v?(v===qu.answer?'right':'wrong'):''}" data-q="${esc(key)}" data-val="${esc(v)}" aria-pressed="${val===v}">${esc(v)}</button>`).join('')}</div>`;if(qu.type==='text')body=`<textarea data-text="${esc(key)}" aria-label="Respuesta abierta ${i+1}" placeholder="Escribe aquí tu explicación...">${esc(val||'')}</textarea>`;if(qu.type==='order'){const arr=Array.isArray(val)?val:[];body=`<p class="minor">Pulsa los elementos en el orden correcto.</p><div class="order-list">${arr.map((v,j)=>`<span class="order-item">${j+1}. ${esc(v)} <button data-remove="${esc(key)}" data-index="${j}" aria-label="Quitar ${esc(v)}">×</button></span>`).join('')}</div><div class="option-group">${qu.opts.items.filter(v=>!arr.includes(v)).map(v=>`<button class="option" data-add="${esc(key)}" data-val="${esc(v)}">＋ ${esc(v)}</button>`).join('')}</div>${arr.length===qu.opts.items.length?`<span class="chip">Secuencia completa</span>`:''}`}return `<section class="question"><div class="qindex">Pregunta ${i+1} de ${t.questions.length}</div><h3>${esc(qu.text)}</h3>${body}${state.completed[t.id]&&qu.answer!==null?`<p class="feedback ${qu.type==='order'?JSON.stringify(val)===JSON.stringify(qu.answer)?'':'bad':val===qu.answer?'':'bad'}">${qu.type==='order'?JSON.stringify(val)===JSON.stringify(qu.answer)?'✓ Correcto':'↻ Revisa el orden':val===qu.answer?'✓ Correcto':'↻ Inténtalo de nuevo'}${qu.explain?'<br>'+esc(qu.explain):''}</p>`:''}</section>`}
function report(){const rows=TASKS.map(t=>{const s=score(t);return `<tr><td>${t.id}. ${t.title}</td><td>${state.completed[t.id]?'Realizada':'Pendiente'}</td><td>${s.total?`${s.correct}/${s.total}`:'—'}</td></tr>`}).join('');return `<div class="stepnav">${btn('← Inicio','home','secondary')}</div><section class="panel"><h2>📊 Informe de aprendizaje</h2><p><strong>Alumno/equipo:</strong> ${esc(state.name||'No indicado')}<br><strong>Actividades terminadas:</strong> ${completed()} de 10</p>${bar()}<div style="overflow-x:auto"><table class="report-table"><thead><tr><th>Actividad</th><th>Estado</th><th>Autoevaluables</th></tr></thead><tbody>${rows}</tbody></table></div><p class="muted minor">Las puntuaciones solo corresponden a preguntas con respuesta cerrada. Las explicaciones escritas deben revisarse: no se califican automáticamente.</p><div class="buttons">${btn('Imprimir informe','print')}${btn('Exportar respuestas (.json)','export','secondary')}${btn('Volver al inicio','home','secondary')}</div></section>`}
function render(){document.querySelector('#studentTag').textContent=state.name||'Sin identificar';$('#app').innerHTML=route.page==='home'?home():route.page==='session'?session(route.id):route.page==='task'?task(route.id):report();window.scrollTo({top:0,behavior:'instant'})}
function navigate(page,id){route={page,id};showKeys=false;render()}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2800)}
function exportData(){const blob=new Blob([JSON.stringify({nombre:state.name,fecha:new Date().toISOString(),respuestas:state.responses,actividades_completadas:state.completed},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mision-cuerpo-'+(state.name||'alumno').trim().replace(/[^a-z0-9áéíóúñ_-]/gi,'_')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function action(a){if(a==='home')return navigate('home');if(a==='name'){state.name=$('#name').value.trim();save();render();return toast('Nombre guardado')}if(a==='report')return navigate('report');if(a==='print'){if(route.page!=='report')navigate('report');setTimeout(()=>window.print(),150);return}if(a==='export')return exportData();if(a==='reset'){if(confirm('¿Borrar todas las respuestas y el progreso de este navegador?')){state={name:'',responses:{},completed:{}};save();navigate('home');toast('Progreso borrado')}return}const [kind,idstr]=a.split(':'),id=+idstr;if(kind==='session')return navigate('session',id);if(kind==='task')return navigate('task',id);if(kind==='finish'){const t=TASKS.find(t=>t.id===id),missing=t.questions.filter(qu=>{const v=state.responses[t.id+'_'+qu.id];return qu.type==='order'? !Array.isArray(v)||v.length!==qu.opts.items.length : qu.type==='text'?!String(v||'').trim():!v});if(missing.length&&!confirm(`Quedan ${missing.length} respuestas sin completar. ¿Terminar de todas formas?`))return;state.completed[id]=true;save();render();toast('Reto guardado correctamente')}}
document.addEventListener('click',e=>{const act=e.target.closest('[data-action]');if(act)return action(act.dataset.action);const op=e.target.closest('[data-q]');if(op){state.responses[op.dataset.q]=op.dataset.val;save();const y=scrollY;render();scrollTo(0,y);return}const add=e.target.closest('[data-add]');if(add){const k=add.dataset.add;state.responses[k]=[...(state.responses[k]||[]),add.dataset.val];save();const y=scrollY;render();scrollTo(0,y);return}const rem=e.target.closest('[data-remove]');if(rem){const k=rem.dataset.remove;state.responses[k]=(state.responses[k]||[]).filter((_,i)=>i!==+rem.dataset.index);save();const y=scrollY;render();scrollTo(0,y)}});
document.addEventListener('input',e=>{const k=e.target.dataset.text;if(k){state.responses[k]=e.target.value;save()}});document.querySelector('#btnHome').addEventListener('click',()=>navigate('home'));render();

</script></body></html>
