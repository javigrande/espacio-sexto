<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anatomy Strikers</title><link rel="stylesheet" href="styles.css"></head><body data-mode="practice"><div class="wrap">
<section class="cover"><img src="assets/cover.png" alt="Anatomy Strikers"><div class="coverOverlay"><button class="startBtn" onclick="showIntro()">▶ ¡JUGAR!</button></div></section>
<section id="identity" class="panel hidden"><div class="eyebrow">ESPACIO 6.º · EVALUACIÓN</div><h2>Ficha del jugador</h2><div class="row"><input id="studentCode" placeholder="Ej.: 6B-K7P4"><select id="group"><option value="">Selecciona grupo</option><option>6.º A</option><option>6.º B</option></select></div><div id="identityMsg" class="feedback bad"></div><br><button class="btn" onclick="startEvaluation()">ENTRAR AL CAMPO →</button></section>
<section id="game" class="panel hidden">
<div class="scorebar"><div class="score">⚡ ENERGÍA <b id="energy">100%</b></div><div class="score">🔥 RACHA <b id="streak">x0</b></div><div class="score">⚽ GOLES <b id="goals">0</b></div><div class="score">🏆 RANGO <b id="rankTop">Novato/a</b></div></div>
<div id="missions" class="missions"></div><div class="head"><div><span id="tag" class="tag"></span><h2 id="counter"></h2></div></div><div class="progress"><div id="bar"></div></div><div id="prompt" class="prompt"></div><div id="task" class="taskCard"></div><div id="feedback" class="feedback"></div><div class="footer"><span class="note">En práctica verás la corrección después de cada jugada.</span><div><button id="check" class="btn alt hidden" onclick="check()">⚡ COMPROBAR</button> <button id="next" class="btn yellow hidden" onclick="nextTask()">SIGUIENTE JUGADA →</button></div></div>
</section>
<section id="result" class="panel hidden final"><div>🏆⚽🏆</div><h2>¡CAMINO A LA FINAL COMPLETADO!</h2><div class="rank" id="rank">A</div><div class="stats"><div class="stat"><small>Aciertos</small><b id="rCorrect"></b></div><div class="stat"><small>Precisión</small><b id="rAcc"></b></div><div class="stat"><small>Nota</small><b id="rScore"></b></div><div class="stat"><small>Goles</small><b id="rGoals"></b></div></div><div id="saveState" class="feedback"></div><button id="retry" class="btn alt hidden" onclick="retrySend()">REINTENTAR ENVÍO</button></section>
</div><script src="alumnos-validos.js"></script><script src="app.js"></script></body></html>
