<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIGESTIVE DASH</title><link rel="stylesheet" href="styles.css"></head><body data-mode="evaluation"><div class="wrap">
<section class="top"><div class="brand">DIGESTIVE <span>DASH</span></div><div class="pills"><span class="pill p1">Tubo digestivo</span><span class="pill p2">Glándulas</span><span class="pill p3">Absorción</span><span class="pill p4">Digestión</span></div></section>
<section id="identity" class="panel "><h2>Modo evaluación</h2><div class="row"><input id="studentCode" placeholder="Ej.: 6B-K7P4"><select id="group"><option value="">Selecciona grupo</option><option>6.º A</option><option>6.º B</option></select></div><div id="identityMsg" class="feedback bad"></div><br><button class="btn" onclick="startEvaluation()">Comenzar</button></section>
<section id="game" class="panel hidden">
<div class="scorebar"><div class="score">⚡ Energía <b id="energy">100%</b></div><div class="score">🔥 Racha <b id="streak">x0</b></div><div class="score">⭐ Puntos <b id="score">0</b></div><div class="score">🏆 Rango <b id="rankTop">Explorador</b></div></div>
<div id="missions" class="missions"></div><div class="head"><span id="tag" class="tag"></span><span id="counter" class="counter"></span></div><div class="progress"><div id="bar"></div></div>
<div class="main"><div class="task"><div id="prompt" class="prompt"></div><div id="taskbody"></div><div id="feedback" class="feedback"></div></div></div>
<div class="footer"><span class="note">Sin mostrar soluciones durante la evaluación.</span><div><button id="check" class="btn" onclick="check()">Comprobar</button> <button id="next" class="btn orange hidden" onclick="nextTask()">Siguiente →</button></div></div>
</section>
<section id="result" class="panel hidden"><h2>¡Digestive Dash completado!</h2><div class="stats"><div class="stat"><small>Aciertos</small><b id="rCorrect"></b></div><div class="stat"><small>Precisión</small><b id="rAcc"></b></div><div class="stat"><small>Nota</small><b id="rScore"></b></div><div class="stat"><small>Mejor racha</small><b id="rStreak"></b></div></div><div id="saveState" class="feedback"></div><button id="retry" class="btn hidden" onclick="retrySend()">Reintentar envío</button></section>
</div><script src="alumnos-validos.js"></script><script src="app.js"></script></body></html>
