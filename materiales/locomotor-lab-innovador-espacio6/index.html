<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Locomotor Lab</title><link rel="stylesheet" href="styles.css"></head><body data-mode="practice"><div class="wrap">
<section class="hero"><div class="kicker">ESPACIO 6.º · CIENCIAS NATURALES</div><h1>Locomotor Lab</h1><p>Arrastra, une, completa, clasifica y selecciona para dominar el aparato locomotor.</p><div class="badges"><span class="badge">15 retos</span><span class="badge">5 formatos</span><span class="badge">Huesos + músculos</span><span class="badge">Nota /10</span></div></section>
<section id="identity" class="panel hidden"><h2>Modo evaluación</h2><div class="row"><input id="studentCode" placeholder="Ej.: 6B-K7P4"><select id="group"><option value="">Selecciona grupo</option><option>6.º A</option><option>6.º B</option></select></div><div id="identityMsg" class="feedback bad"></div><br><button onclick="startEvaluation()">Comenzar evaluación</button></section>
<section id="quiz" class="panel hidden"><div class="top"><div><div class="mission" id="mission"></div><b>Reto <span id="qnum">1</span>/<span id="total">15</span></b></div><div class="hud"><span>⚡ <b id="xp">0</b> XP</span><span>🔥 <b id="combo">0</b></span></div></div><div class="progress"><div id="bar"></div></div><div class="title" id="taskTitle"></div><div id="task"></div><div id="feedback" class="feedback"></div><div class="footer"><span>Feedback inmediato</span><div><button id="check" onclick="check()">Comprobar</button> <button id="next" class="secondary hidden" onclick="nextTask()">Siguiente →</button></div></div></section>
<section id="result" class="panel hidden"><h2>Laboratorio completado</h2><div class="stats"><div class="stat"><small>Retos</small><b id="rCorrect"></b></div><div class="stat"><small>Precisión</small><b id="rAcc"></b></div><div class="stat"><small>Nota</small><b id="rScore"></b></div><div class="stat"><small>XP</small><b id="rXp"></b></div></div><div id="saveState" class="feedback"></div><button id="retry" class="secondary hidden" onclick="retrySend()">Reintentar envío</button></section>
</div><script src="alumnos-validos.js"></script><script src="app.js"></script></body></html>
