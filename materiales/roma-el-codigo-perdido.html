<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roma: El código perdido</title>
<style>
:root{--ink:#29231c;--paper:#fffaf0;--gold:#e8ad08;--red:#9d3025;--line:#ddcdae;--green:#357b49}
*{box-sizing:border-box}body{margin:0;background:#f2eadb;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
header{background:#211d19;color:#fff;border-bottom:7px solid var(--gold);padding:18px}.wrap{max-width:1050px;margin:auto}
.head{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
h1{margin:0;font:800 clamp(25px,4vw,39px) Georgia,serif;letter-spacing:1px}.sub{opacity:.8;margin-top:4px}
.stats{display:flex;gap:8px}.pill{background:#3a332c;border-radius:999px;padding:9px 13px;font-weight:800}
main{padding:20px 14px 45px}.story,.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px}
.story{border-left:7px solid var(--gold);line-height:1.5}.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:15px 0}
.seal{text-align:center;padding:10px 5px;background:#e7decd;border-radius:11px;font-weight:800;font-size:13px}.seal.on{background:#ffe49a}.seal.done{background:#cce8d2}
.panel{min-height:440px}.mtitle{font:700 27px Georgia,serif;margin:0 0 5px}.prompt{font-size:20px;font-weight:750;margin:20px 0}.big{text-align:center;font:700 clamp(38px,8vw,64px) Georgia,serif;color:var(--red);margin:22px 0}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:720px;margin:auto}
button{min-height:49px;border:1px solid #c7b793;border-radius:12px;background:#fff;color:var(--ink);font:700 16px system-ui;padding:11px;cursor:pointer}button:hover{background:#fff1c5;border-color:var(--gold)}
.primary{background:#29231e;color:white;border-color:#29231e}.symbols,.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.symbol{font:700 26px Georgia,serif;min-width:58px}
.builder{max-width:720px;margin:12px auto;min-height:72px;background:#fff;border:2px dashed #c7b793;border-radius:13px;display:flex;align-items:center;justify-content:center;font:700 38px Georgia,serif;overflow-wrap:anywhere;padding:8px}
.feedback{max-width:760px;margin:16px auto 0;padding:13px;border-radius:12px;background:#eee5d5;min-height:52px;text-align:center;font-weight:700}.good{background:#d7eddc}.bad{background:#f3d6d3;color:#782219}.hint{background:#fff0b9}.center{text-align:center}.rank{font:700 31px Georgia,serif;color:var(--red)}
@media(max-width:600px){.options{grid-template-columns:1fr}.seal span{display:none}.panel{padding:14px}}
</style></head>
<body>
<header><div class="wrap head"><div><h1>🏛️ ROMA: EL CÓDIGO PERDIDO</h1><div class="sub">Expedición matemática · 6.º de Primaria</div></div><div class="stats"><div class="pill">🪙 <span id="coins">0</span></div><div class="pill">🔥 <span id="streak">0</span></div><div class="pill">⭐ <span id="score">0</span>/<span id="total">0</span></div></div></div></header>
<main class="wrap"><section class="story"><b>📜 LA MISIÓN</b><br>Una caja romana ha aparecido cerrada con cinco sellos. Para abrirla tendrás que reconocer símbolos, traducir inscripciones, construir números, detectar errores y resolver el código final.</section><div class="progress" id="progress"></div><section class="panel" id="game"></section></main>
<script>
const val={I:1,V:5,X:10,L:50,C:100,D:500,M:1000};
function roman(n){const a=[[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];let s="";for(const [v,r] of a)while(n>=v){s+=r;n-=v}return s}
const $=x=>document.getElementById(x),game=$("game"),names=["Legionarios","Traductor","Construye Roma","El escriba","Cámara secreta"];
let m=0,q=0,coins=0,streak=0,score=0,total=0,lock=false,built="",hints=0;
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function mix(a){return a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}
function ui(){$("coins").textContent=coins;$("streak").textContent=streak;$("score").textContent=score;$("total").textContent=total;$("progress").innerHTML=names.map((n,i)=>`<div class="seal ${i<m?"done":i===m?"on":""}">${i<m?"✓":"🏺"} <span>${n}</span></div>`).join("")}
function title(a,b){return `<h2 class="mtitle">${a}</h2><div>${b}</div>`}
function fb(t,c=""){$("fb").className="feedback "+c;$("fb").innerHTML=t}
function answer(ok,good,bad){if(lock)return;lock=true;total++;if(ok){score++;streak++;coins+=streak%3===0?15:10;fb("✅ "+good+(streak%3===0?" 🔥 ¡Racha de 3! Bonus de denarios.":""),"good")}else{streak=0;fb("❌ "+bad,"bad")}ui();setTimeout(()=>{lock=false;q++;if(q===4){q=0;m++}render()},1100)}
function render(){ui();if(m>=5)return end();if(m===0)return symbols();if(m===1)return translate();if(m===2)return build();if(m===3)return errors();return chamber()}
function symbols(){const all=[["I",1],["V",5],["X",10],["L",50],["C",100],["D",500],["M",1000]],p=all[rnd(0,6)],opts=mix([p[1],...mix(all.filter(x=>x[1]!==p[1])).slice(0,3).map(x=>x[1])]);game.innerHTML=title("🏺 Escuela de legionarios","Domina los siete símbolos básicos.")+`<div class="big">${p[0]}</div><div class="prompt center">¿Qué valor tiene?</div><div class="options">${opts.map(x=>`<button data-x="${x}">${x}</button>`).join("")}</div><div id="fb" class="feedback">Elige una respuesta.</div>`;game.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>answer(+b.dataset.x===p[1],"Símbolo descifrado.",`${p[0]} vale ${p[1]}.`))}
function translate(){const n=rnd(12,1999),r=roman(n),mode=Math.random()<.5,correct=mode?r:String(n);let opts=mode?[r,roman(Math.max(1,n-1)),roman(n+1),roman(Math.max(1,n-10))]:[String(n),String(n+1),String(Math.max(1,n-1)),String(n+10)];opts=[...new Set(opts)];while(opts.length<4)opts.push(mode?roman(n+rnd(2,20)):String(n+rnd(2,20)));opts=mix(opts.slice(0,4));game.innerHTML=title("⚔️ Traductor imperial","Convierte en los dos sentidos.")+`<div class="big">${mode?n:r}</div><div class="prompt center">${mode?"¿Cómo se escribe en números romanos?":"¿Qué número representa?"}</div><div class="options">${opts.map(x=>`<button data-x="${x}">${x}</button>`).join("")}</div><div id="fb" class="feedback">Descompón mentalmente antes de elegir.</div>`;game.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>answer(b.dataset.x===correct,"¡Traducción correcta!",`La respuesta era ${correct}.`))}
function build(){const n=rnd(21,1999),correct=roman(n);built="";hints=0;game.innerHTML=title("🧱 Construye Roma","Construye el número pulsando símbolos. Puedes repetirlos.")+`<div class="big">${n}</div><div id="builder" class="builder">—</div><div class="symbols">${["M","D","C","L","X","V","I"].map(s=>`<button class="symbol" data-s="${s}">${s}</button>`).join("")}</div><div class="actions"><button id="undo">↶ Borrar</button><button id="hint">💡 Pista</button><button id="check" class="primary">Comprobar</button></div><div id="fb" class="feedback">Primero piensa cómo descomponerías ${n}.</div>`;const show=()=>$("builder").textContent=built||"—";game.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{if(built.length<16){built+=b.dataset.s;show()}});$("undo").onclick=()=>{built=built.slice(0,-1);show()};$("hint").onclick=()=>{hints++;let a=[Math.floor(n/1000)*1000,Math.floor(n%1000/100)*100,Math.floor(n%100/10)*10,n%10].filter(Boolean);fb(hints===1?`💡 Descomposición: ${a.join(" + ")}`:hints===2?"💡 Recuerda: 4=IV · 9=IX · 40=XL · 90=XC · 400=CD · 900=CM":`💡 La solución tiene ${correct.length} símbolos.`,"hint")};$("check").onclick=()=>{if(!built)return fb("Construye primero tu respuesta.","bad");answer(built===correct,"¡Construcción perfecta!",`Has escrito ${built}. La forma correcta es ${correct}.`)}}
function errors(){const cases=[[4,"IIII","IV"],[9,"VIIII","IX"],[40,"XXXX","XL"],[49,"IL","XLIX"],[90,"LXXXX","XC"],[99,"IC","XCIX"],[400,"CCCC","CD"],[900,"DCCCC","CM"]],useTrap=Math.random()<.65;let n,shown,correct,isOk;if(useTrap){let c=cases[rnd(0,cases.length-1)];n=c[0];shown=c[1];correct=c[2];isOk=false}else{n=rnd(10,999);correct=roman(n);shown=correct;isOk=true}game.innerHTML=title("🕵️ El escriba se equivocó","No todo lo que parece romano está bien escrito.")+`<div class="big">${shown}</div><div class="prompt center">Un escriba afirma que representa ${n}. ¿La escritura es correcta?</div><div class="options"><button data-x="1">✓ Correcta</button><button data-x="0">✗ Hay un error</button></div><div id="fb" class="feedback">Comprueba el valor y las reglas de escritura.</div>`;game.querySelectorAll("[data-x]").forEach(b=>{let choice=b.dataset.x==="1";b.onclick=()=>answer(choice===isOk,isOk?"Sí, cumple las reglas.":`¡Bien visto! Debe escribirse ${correct}.`,`La forma correcta es ${correct}.`)})}
function chamber(){const year=rnd(1200,2026),r=roman(year),mode=Math.random()<.5;if(mode){let opts=mix([r,roman(year-1),roman(year+1),roman(year-10)]);game.innerHTML=title("🔐 La cámara secreta","Usa los números romanos en una situación real.")+`<div class="prompt">En una fachada aparece el año <b>${year}</b>. ¿Qué inscripción deberían grabar?</div><div class="options">${opts.map(x=>`<button data-x="${x}">${x}</button>`).join("")}</div><div id="fb" class="feedback">Descompón el año en unidades de millar, centenas, decenas y unidades.</div>`;game.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>answer(b.dataset.x===r,"¡Inscripción correcta!",`Debería escribirse ${r}.`))}else{const n=rnd(11,99),rr=roman(n),opts=mix([n,n+1,n+5,n-1]);game.innerHTML=title("🔐 La cámara secreta","Descifra una inscripción dentro de su contexto.")+`<div class="prompt">Un manuscrito está marcado como capítulo <b>${rr}</b>. ¿Qué capítulo es?</div><div class="options">${opts.map(x=>`<button data-x="${x}">${x}</button>`).join("")}</div><div id="fb" class="feedback">Lee cada símbolo y comprueba si alguno resta.</div>`;game.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>answer(+b.dataset.x===n,"¡Manuscrito descifrado!",`Era el capítulo ${n}.`))}}
function end(){const pct=total?Math.round(score/total*100):0,rank=pct>=90?"CÓNSUL MATEMÁTICO":pct>=75?"CENTURIÓN":pct>=60?"LEGIONARIO":"RECLUTA";game.innerHTML=`<div class="center"><div class="big">🏆</div><h2 class="mtitle">¡Código perdido recuperado!</h2><p>Has abierto los cinco sellos.</p><div class="rank">${rank}</div><p><b>${score}/${total}</b> correctas · <b>${pct}%</b> de precisión · <b>${coins}</b> denarios</p><div class="actions"><button id="again" class="primary">🔄 Nueva expedición</button></div></div>`;$("again").onclick=()=>{m=q=coins=streak=score=total=0;render()}}
render();
</script></body></html>
